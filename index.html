<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرآة وصدى – ومضات ذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rubik:wght@400;500;700;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff4757; --orange:#ffa502; --yellow:#eccc68; --green:#2ed573; --blue:#1e90ff; --purple:#9c27b0;
    --bg:#f8f9fa; --card:#ffffff; --ink:#2f3542; --muted:#57606f; --soft:#a4b0be; --line:#eceef1;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Rubik','Poppins',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;overflow-x:hidden}
  html[lang="he"] body{font-family:'Rubik','Cairo',sans-serif}
  html[lang="en"] body{font-family:'Poppins','Rubik',sans-serif}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,71,87,.05),rgba(255,165,2,.05),rgba(46,213,115,.05),rgba(30,144,255,.05))}
  .sparks{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .sparks i{position:absolute;width:6px;height:6px;border-radius:50%;opacity:.0;animation:twinkle 5s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.55;transform:scale(1)}}

  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
  .top-nav{display:flex;justify-content:center;margin-bottom:18px}
  .lang-switcher{display:flex;gap:6px;background:#fff;padding:6px;border-radius:30px;box-shadow:0 4px 15px rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.05)}
  .lang-btn{border:none;background:none;padding:7px 18px;font-size:14px;font-weight:700;cursor:pointer;border-radius:25px;font-family:inherit;color:#747d8c;transition:background-color .25s,color .25s,box-shadow .25s}
  .lang-btn:hover:not(.active){background:rgba(30,144,255,.08);color:var(--blue)}
  .lang-btn.active{background:linear-gradient(45deg,var(--blue),#00d2d3);color:#fff;box-shadow:0 4px 12px rgba(30,144,255,.3)}

  header{text-align:center;margin-bottom:26px}
  .logo-container{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;padding:5px;
    background:linear-gradient(45deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple));
    box-shadow:0 10px 30px rgba(0,0,0,.12);animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(30,144,255,.18)}50%{box-shadow:0 10px 34px rgba(255,165,2,.35)}}
  .logo-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:#0f1a3a}
  .brand{font-size:.95rem;font-weight:700;color:var(--muted);margin-bottom:2px}
  h1{font-size:2.1rem;font-weight:900;line-height:1.3;margin-bottom:6px;
    background:linear-gradient(45deg,#ff4757,#1e90ff,#2ed573);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:var(--muted);font-weight:500}

  .card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,.04);border:2px solid transparent;transition:border-color .3s,box-shadow .3s}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .info label{font-size:.88rem;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
  .info input{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:#fbfcfd;outline:none;transition:border-color .2s}
  .info input:focus{border-color:var(--blue)}
  .legend{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:12px;font-weight:600}
  .progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
  .progress span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple));background-size:820px 100%;transition:width .35s}
  html[dir="rtl"] .progress span{margin-inline-start:0}
  .ptext{font-size:.85rem;color:var(--muted);text-align:center;font-weight:600}

  .section-head{display:flex;align-items:center;gap:10px;margin:26px 4px 12px}
  .section-head .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;color:#fff}
  .section-head h2{font-size:1.2rem;font-weight:800}

  .q{display:flex;gap:12px;align-items:flex-start}
  .num{flex:0 0 34px;height:34px;border-radius:50%;font-weight:800;display:grid;place-items:center;font-family:'Poppins',sans-serif;font-size:.95rem}
  .q p{margin:3px 0 12px;font-weight:600;font-size:1.04rem}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .scale input{position:absolute;opacity:0;pointer-events:none}
  .scale label{border:2px solid var(--line);border-radius:14px;padding:7px 2px;text-align:center;cursor:pointer;user-select:none;transition:background-color .15s,border-color .15s,transform .15s}
  .scale label b{display:block;font-size:1.2rem;font-family:'Poppins',sans-serif}
  .scale label small{display:block;font-size:.7rem;color:var(--muted);line-height:1.2;min-height:1.7em}
  .scale label:hover{border-color:#cfd5dc;transform:translateY(-2px)}
  .scale input:focus-visible + label{outline:3px solid var(--blue);outline-offset:2px}
  .scale input:checked + label{color:#fff;border-color:transparent}
  .scale input:checked + label small{color:#fff}
  .scale input[value="1"]:checked + label{background:var(--red)}
  .scale input[value="2"]:checked + label{background:var(--orange)}
  .scale input[value="3"]:checked + label{background:#d6b44a}
  .scale input[value="4"]:checked + label{background:#20bf6b}
  .scale input[value="5"]:checked + label{background:var(--blue)}
  .card.missing{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,71,87,.12)}

  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  button.main,button.ghost{font:inherit;font-weight:800;border-radius:30px;padding:12px 30px;cursor:pointer;transition:transform .2s,box-shadow .2s}
  button.main{border:0;color:#fff;background:linear-gradient(45deg,var(--blue),#00d2d3);box-shadow:0 6px 18px rgba(30,144,255,.3)}
  button.main:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,144,255,.38)}
  button.ghost{background:#fff;border:2px solid var(--blue);color:var(--blue)}
  button.ghost:hover{background:rgba(30,144,255,.07)}
  .msg{color:var(--red);text-align:center;margin-top:10px;min-height:1.4em;font-weight:700}

  #result{display:none;border-color:transparent;position:relative;overflow:hidden}
  #result::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple))}
  .score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:8px}
  .ring{--p:0;width:140px;height:140px;border-radius:50%;flex:0 0 auto;background:conic-gradient(var(--rc,var(--blue)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
  .ring div{width:112px;height:112px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;align-content:center}
  .ring strong{font-size:2.3rem;font-weight:800;line-height:1;font-family:'Poppins',sans-serif}
  .ring span{font-size:.8rem;color:var(--muted);font-family:'Poppins',sans-serif}
  .who{font-size:.9rem;color:var(--muted);font-weight:600}
  .level{font-size:1.4rem;font-weight:900;margin:2px 0}
  .bars{display:grid;gap:10px;margin-top:18px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:.92rem;font-weight:600}
  .bar-track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;width:0;transition:width .8s}
  .bar-row .pct{font-family:'Poppins',sans-serif;font-weight:700;text-align:center}
  h3{margin:22px 0 10px;font-size:1.12rem;font-weight:800}
  ul{padding-inline-start:20px}
  li{margin-bottom:10px}
  .tag{display:inline-block;font-size:.72rem;padding:1px 10px;border-radius:99px;background:rgba(255,165,2,.12);color:#c77d00;margin-inline-start:6px;font-weight:800}
  .tag.low{background:rgba(255,71,87,.12);color:var(--red)}
  .general{background:rgba(30,144,255,.06);border-radius:16px;padding:12px 14px}
  footer{padding:24px 16px 20px;color:var(--soft);font-size:.88rem;text-align:center}
  footer a{color:var(--blue);font-weight:700;text-decoration:none}

  @media (max-width:560px){
    .info{grid-template-columns:1fr}
    h1{font-size:1.6rem}
    .scale{gap:5px}
    .scale label small{font-size:.6rem}
    .bar-row{grid-template-columns:105px 1fr 42px;font-size:.82rem}
    .logo-container{width:112px;height:112px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
  .hint{font-size:.85rem;color:var(--muted);margin:-6px 0 10px;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips input,.rating10 input{position:absolute;opacity:0;pointer-events:none}
  .chips label{border:2px solid var(--line);border-radius:30px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.93rem;user-select:none;transition:background-color .15s,border-color .15s,color .15s}
  .chips label:hover{border-color:#cfd5dc}
  .chips input:focus-visible + label,.rating10 input:focus-visible + label{outline:3px solid var(--blue);outline-offset:2px}
  .chips input:checked + label{background:var(--chip,var(--blue));border-color:transparent;color:#fff}
  .other-in,textarea{width:100%;margin-top:10px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:#fbfcfd;outline:none}
  .other-in:focus,textarea:focus{border-color:var(--blue)}
  textarea{min-height:90px;resize:vertical}
  .opt{font-size:.78rem;color:var(--soft);font-weight:600}
  .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
  .stage{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;font-weight:700;font-size:.92rem;color:var(--soft);transition:all .3s}
  .stage .ic{font-size:1.5rem;display:block}
  .stage.on{color:#fff;border-color:transparent;transform:scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .bar-row.nop{grid-template-columns:170px 1fr}
  .plan{background:linear-gradient(135deg,rgba(30,144,255,.06),rgba(46,213,115,.06));border:2px dashed rgba(30,144,255,.35);border-radius:18px;padding:14px 16px}
  .plan dt{font-weight:800;margin-top:10px;font-size:.95rem}
  .plan dt:first-child{margin-top:0}
  .plan dd{margin:2px 0 0}
  .tip-row{margin-bottom:10px}
  .rating10{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .rating10 label{border:2px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;transition:background-color .15s,transform .15s}
  .rating10 label:hover{transform:translateY(-2px)}
  .rating10 input:checked + label{background:linear-gradient(45deg,var(--blue),#00d2d3);color:#fff;border-color:transparent}

  /* hub */
  .hub-section{margin:30px 4px 14px}
  .hub-section h2{font-size:1.4rem;font-weight:900}
  .hub-section p{color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .fcard{position:relative;background:#fff;border-radius:24px;padding:24px 16px 18px;text-align:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.04);border:2px solid transparent;transition:transform .3s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:175px;outline:none}
  .fcard:not(.soon):hover,.fcard:not(.soon):focus-visible{border-color:var(--c);transform:translateY(-5px);box-shadow:0 12px 25px rgba(0,0,0,.08)}
  .ficon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.75rem;background:var(--cs)}
  .ftitle{font-weight:800;font-size:1.08rem;line-height:1.4}
  .fmeta{font-size:.8rem;color:var(--muted);font-weight:600}
  .info-btn{position:absolute;top:10px;inset-inline-end:10px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(30,144,255,.1);color:var(--blue);font-weight:800;cursor:pointer;font-family:'Poppins',sans-serif}
  .tip{position:absolute;left:8px;right:8px;top:calc(100% + 8px);background:#2f3542;color:#fff;font-size:.88rem;line-height:1.6;padding:10px 12px;border-radius:14px;z-index:30;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s,transform .2s,visibility .2s;box-shadow:0 10px 25px rgba(0,0,0,.2);text-align:start;font-weight:500;cursor:default}
  .tip::before{content:'';position:absolute;top:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#2f3542}
  @media (hover:hover){.fcard:hover .tip{opacity:1;visibility:visible;transform:none}}
  .fcard.open .tip{opacity:1;visibility:visible;transform:none}
  .fcard.soon{opacity:.6;cursor:default}
  .fcard:hover,.fcard.open,.fcard:focus-within{z-index:40}
  .soon-badge{background:rgba(255,165,2,.1);color:#c77d00;border:1px solid rgba(255,165,2,.3);padding:2px 10px;border-radius:30px;font-size:.75rem;font-weight:700}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .backlink{display:inline-flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--blue);color:var(--blue);padding:6px 16px;border-radius:30px;font-weight:700;text-decoration:none;font-size:.92rem;transition:background-color .2s,color .2s}
  .backlink:hover{background:var(--blue);color:#fff}
  .mini-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px;color:var(--muted);font-weight:700;font-size:.92rem}
  .mini-brand img{width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple))}
  .fhead{text-align:center;margin:4px 0 18px}
  .fhead .ficon{margin:0 auto 10px;width:64px;height:64px;font-size:2rem}
  .fhead h1{font-size:1.9rem}
  .metas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .metas span{background:var(--bg);border-radius:20px;padding:4px 12px;font-size:.85rem;font-weight:600}
  .priv{font-size:.92rem;color:var(--ink);background:rgba(46,213,115,.09);border-radius:12px;padding:9px 12px;margin-top:6px}
  .intro h3{margin-top:0}
  .send-status{margin-top:10px;font-weight:700}
  .home-intro{max-width:620px;margin:0 auto;text-align:center;color:var(--muted)}
  @media (max-width:560px){.bar-row.nop{grid-template-columns:120px 1fr}.stage{font-size:.8rem}.rating10{grid-template-columns:repeat(5,1fr)}.fhead h1{font-size:1.5rem}}
</style>
</head>

<div class="sparks" id="sparks"></div>
<div class="wrap" id="app"></div>

  a:{ar:"عندما يختلف رأي زميلك، استمع حتى النهاية ثم قل: «أفهم رأيك، ورأيي هو…» — الاختلاف لا يعني الخصام.",he:"כשחבר חושב אחרת, הקשיבו עד הסוף ואז אמרו: «אני מבין/ה אותך, ולדעתי…» — מחלוקת אינה ריב.",en:"When a classmate disagrees, listen to the end, then say: “I see your point, and I think…” — disagreeing isn't fighting."}},
 {s:0,r:true,t:{ar:"أحيانًا أسخر من زملائي أو أستهزئ بهم.",he:"לפעמים אני צוחק/ת על חבריי או לועג/ת להם.",en:"Sometimes I make fun of or mock my classmates."},
  g:{ar:"الامتناع عن السخرية والتنمّر",he:"הימנעות מלעג ומבריונות",en:"Avoiding mocking & bullying"},
  a:{ar:"ما يبدو مزحة لك قد يجرح زميلك بعمق. توقّف قبل التعليق على شكل أحد أو أخطائه، وإن أخطأت فاعتذر له مباشرة.",he:"מה שנראה לכם כבדיחה עלול לפגוע עמוקות בחבר. עצרו לפני שאתם מעירים על מראה או טעויות של מישהו, ואם טעיתם — התנצלו מיד.",en:"What feels like a joke to you can hurt a classmate deeply. Stop before commenting on someone's looks or mistakes, and if you slip, apologize right away."}},
 {s:0,t:{ar:"أحلّ الخلافات بالحوار وليس بالصراخ أو العنف.",he:"אני פותר/ת מחלוקות בשיחה ולא בצעקות או באלימות.",en:"I solve conflicts by talking, not by shouting or violence."},
  g:{ar:"حلّ الخلافات بالحوار",he:"פתרון מחלוקות בשיחה",en:"Resolving conflicts by talking"},
  a:{ar:"عند الغضب ابتعد قليلًا وخذ أنفاسًا عميقة، ثم تحدّث بهدوء عمّا أزعجك. وإن لم تنجح، اطلب مساعدة المعلم بدل الرد بالعنف.",he:"כשאתם כועסים התרחקו קצת ונשמו עמוק, ואז דברו ברוגע על מה שהפריע לכם. אם זה לא עוזר, בקשו עזרה מהמורה במקום להגיב באלימות.",en:"When angry, step away and breathe deeply, then calmly say what bothered you. If that doesn't work, ask a teacher for help instead of reacting with force."}},

 {s:1,t:{ar:"ألتزم بقوانين الصف والمدرسة.",he:"אני שומר/ת על כללי הכיתה ובית הספר.",en:"I follow the class and school rules."},
  g:{ar:"الالتزام بالقوانين",he:"שמירה על הכללים",en:"Following the rules"},
  a:{ar:"تذكّر أن القوانين وُضعت لتحمي حق الجميع في التعلّم والأمان. اختر قانونًا واحدًا تجد صعوبة فيه وركّز على الالتزام به هذا الأسبوع.",he:"זכרו שהכללים נועדו להגן על זכותם של כולם ללמוד ולהרגיש בטוחים. בחרו כלל אחד שקשה לכם איתו והתמקדו בו השבוע.",en:"Remember rules exist to protect everyone's right to learn and feel safe. Pick one rule you struggle with and focus on keeping it this week."}},
 {s:1,t:{ar:"أصل إلى الحصص في الوقت المحدد.",he:"אני מגיע/ה לשיעורים בזמן.",en:"I arrive to lessons on time."},
  g:{ar:"الالتزام بالمواعيد",he:"עמידה בזמנים",en:"Being on time"},
  a:{ar:"جهّز حقيبتك في الليلة السابقة، وعد إلى الصف فور انتهاء الاستراحة؛ التأخير يضيّع عليك بداية الشرح ويقاطع زملاءك.",he:"הכינו את התיק בערב הקודם, וחזרו לכיתה מיד בסוף ההפסקה; איחור מפספס את תחילת ההסבר ומפריע לחברים.",en:"Pack your bag the night before and head back to class as soon as break ends; being late means missing the start and interrupting others."}},
 {s:1,t:{ar:"أحضر كتبي ودفاتري وأدواتي اللازمة.",he:"אני מביא/ה את הספרים, המחברות והציוד הנדרש.",en:"I bring the books, notebooks and supplies I need."},
  g:{ar:"الاستعداد بالأدوات اللازمة",he:"הגעה עם הציוד הנדרש",en:"Coming prepared"},
  a:{ar:"علّق برنامج الحصص قرب مكان دراستك، ورتّب حقيبتك حسبه كل مساء.",he:"תלו את מערכת השעות ליד מקום הלמידה, וסדרו את התיק לפיה בכל ערב.",en:"Hang your timetable near your desk at home and pack your bag by it every evening."}},
 {s:1,t:{ar:"أحافظ على نظافة الصف وممتلكاته.",he:"אני שומר/ת על ניקיון הכיתה ועל הציוד שלה.",en:"I keep the classroom and its property clean and cared for."},
  g:{ar:"المحافظة على الصف",he:"שמירה על הכיתה",en:"Caring for the classroom"},
  a:{ar:"الصف بيتك الثاني: ارمِ النفايات في مكانها، ورتّب مكانك قبل الخروج، وتعامل مع الأدوات المشتركة بحرص.",he:"הכיתה היא הבית השני שלכם: זרקו פסולת לפח, סדרו את המקום לפני היציאה, והשתמשו בציוד המשותף בזהירות.",en:"Your class is your second home: bin your rubbish, tidy your spot before leaving, and handle shared equipment with care."}},
 {s:1,r:true,t:{ar:"أتحدّث أو أنشغل بالهاتف أثناء الشرح وأشتّت الآخرين.",he:"אני מדבר/ת או עסוק/ה בטלפון בזמן ההסבר ומפריע/ה לאחרים.",en:"I chat or use my phone during lessons and distract others."},
  g:{ar:"التركيز وعدم تشتيت الآخرين",he:"ריכוז ואי-הפרעה לאחרים",en:"Staying focused, not distracting others"},
  a:{ar:"أبقِ الهاتف مغلقًا في الحقيبة، واجلس بعيدًا عمّن يشجّعك على الحديث. أجّل كلامك مع زملائك إلى الاستراحة.",he:"השאירו את הטלפון כבוי בתיק, ושבו רחוק ממי שגורם לכם לפטפט. שמרו את השיחות עם החברים להפסקה.",en:"Keep your phone off in your bag and sit away from whoever gets you chatting. Save conversations for break time."}},

 {s:2,care:true,t:{ar:"أشعر أنني جزء مهم من صفي.",he:"אני מרגיש/ה שאני חלק חשוב מהכיתה שלי.",en:"I feel I'm an important part of my class."},
  g:{ar:"الشعور بالأهمية في الصف",he:"תחושת חשיבות בכיתה",en:"Feeling valued in class"},
  a:{ar:"لكل طالب مكانه وقدراته. اكتشف ما تجيده (الرسم، التنظيم، المساعدة، الدعابة…) واعرضه في نشاط صفي.",he:"לכל תלמיד יש מקום ויכולות. גלו במה אתם טובים (ציור, ארגון, עזרה, הומור…) והציעו את זה בפעילות כיתתית.",en:"Everyone has a place and a talent. Find what you're good at (drawing, organizing, helping, humor…) and offer it in a class activity."}},
 {s:2,care:true,t:{ar:"أشعر بالأمان والراحة في صفي.",he:"אני מרגיש/ה בטוח/ה ונוח לי בכיתה.",en:"I feel safe and comfortable in my class."},
  g:{ar:"الشعور بالأمان",he:"תחושת ביטחון",en:"Feeling safe"},
  a:{ar:"إذا كان هناك ما يجعلك غير مرتاح أو غير آمن في الصف، فمن حقك أن تخبر المربّي/ة أو المستشار/ة — لا تحتفظ بذلك لنفسك.",he:"אם משהו גורם לכם לאי-נוחות או לחוסר ביטחון בכיתה, זכותכם לספר למחנך/ת או ליועץ/ת — אל תשמרו את זה בבטן.",en:"If something makes you uncomfortable or unsafe in class, you have every right to tell your homeroom teacher or counselor — don't keep it to yourself."}},
 {s:2,t:{ar:"لدي أصدقاء في الصف أستطيع الاعتماد عليهم.",he:"יש לי חברים בכיתה שאני יכול/ה לסמוך עליהם.",en:"I have friends in class I can count on."},
  g:{ar:"صداقات داعمة",he:"חברויות תומכות",en:"Supportive friendships"},
  a:{ar:"الصداقة تبدأ بخطوة صغيرة: اجلس مع زميل جديد في الاستراحة، أو اقترح أن تدرسا معًا، أو انضم لنشاط يحب الآخرون المشاركة فيه.",he:"חברות מתחילה בצעד קטן: שבו עם חבר חדש בהפסקה, הציעו ללמוד יחד, או הצטרפו לפעילות שאחרים אוהבים.",en:"Friendship starts small: sit with someone new at break, suggest studying together, or join an activity others enjoy."}},
 {s:2,r:true,care:true,t:{ar:"أشعر أحيانًا أنني وحيد أو مُهمَل في الصف.",he:"לפעמים אני מרגיש/ה בודד/ה או מוזנח/ת בכיתה.",en:"Sometimes I feel lonely or left out in class."},
  g:{ar:"التواصل وعدم الشعور بالوحدة",he:"קשר עם אחרים במקום בדידות",en:"Feeling connected, not alone"},
  a:{ar:"الشعور بالوحدة يمرّ به كثيرون، وهو ليس عيبًا فيك. شارك ما تشعر به مع المربّي/ة أو شخص تثق به، وجرّب الانضمام لمجموعة أو نشاط واحد صغير.",he:"תחושת בדידות מוכרת לרבים, והיא לא פגם בכם. שתפו את המחנך/ת או מישהו שאתם סומכים עליו, ונסו להצטרף לקבוצה או לפעילות קטנה אחת.",en:"Many people feel lonely sometimes — it's not a flaw in you. Share how you feel with your homeroom teacher or someone you trust, and try joining one small group or activity."}},
 {s:2,t:{ar:"أفتخر بصفي وبإنجازاته.",he:"אני גאה בכיתה שלי ובהישגים שלה.",en:"I'm proud of my class and its achievements."},
  g:{ar:"الفخر بالصف",he:"גאווה בכיתה",en:"Pride in your class"},
  a:{ar:"ساهم في إنجاز يفخر به الجميع: اقترح مشروعًا مشتركًا، أو زيّن لوحة الصف، أو هنّئ زملاءك على نجاحاتهم.",he:"תרמו להישג שכולם יהיו גאים בו: הציעו פרויקט משותף, קשטו את לוח הכיתה, או ברכו חברים על הצלחותיהם.",en:"Help create something everyone's proud of: suggest a joint project, decorate the class board, or congratulate classmates on their successes."}},

 {s:3,t:{ar:"أساعد زملائي عندما يحتاجون إلى المساعدة.",he:"אני עוזר/ת לחבריי כשהם צריכים עזרה.",en:"I help my classmates when they need it."},
  g:{ar:"مساعدة الزملاء",he:"עזרה לחברים",en:"Helping classmates"},
  a:{ar:"لاحظ من يواجه صعوبة واعرض مساعدتك بلطف: شرح سؤال، أو إعارة أداة، أو كلمة تشجيع.",he:"שימו לב למי שמתקשה והציעו עזרה בעדינות: הסבר של שאלה, השאלת ציוד או מילת עידוד.",en:"Notice who's struggling and gently offer help: explain a question, lend a supply, or say an encouraging word."}},
 {s:3,t:{ar:"أشارك في نشاطات وفعاليات الصف والمدرسة.",he:"אני משתתף/ת בפעילויות ובאירועים של הכיתה ובית הספר.",en:"I take part in class and school activities and events."},
  g:{ar:"المشاركة في النشاطات",he:"השתתפות בפעילויות",en:"Joining activities"},
  a:{ar:"اختر فعالية واحدة قادمة (رحلة، يوم رياضي، احتفال) والتزم بالمشاركة فيها؛ النشاطات أفضل طريقة للتقرّب من زملائك.",he:"בחרו אירוע אחד קרוב (טיול, יום ספורט, חגיגה) והתחייבו להשתתף; פעילויות הן הדרך הטובה ביותר להתקרב לחברים.",en:"Pick one upcoming event (a trip, sports day, celebration) and commit to joining; activities are the best way to get closer to classmates."}},
 {s:3,t:{ar:"أتطوّع لمهام ومسؤوليات في الصف.",he:"אני מתנדב/ת לתפקידים ולמשימות בכיתה.",en:"I volunteer for tasks and responsibilities in class."},
  g:{ar:"التطوّع وتحمّل المسؤولية",he:"התנדבות ולקיחת אחריות",en:"Volunteering & taking responsibility"},
  a:{ar:"تطوّع لمهمة بسيطة (توزيع أوراق، ترتيب المكتبة، مسؤول نظافة)؛ المسؤولية تزيد ثقتك بنفسك وتقديرك بين زملائك.",he:"התנדבו למשימה פשוטה (חלוקת דפים, סידור הספרייה, אחראי ניקיון); אחריות מחזקת את הביטחון העצמי ואת ההערכה מהחברים.",en:"Volunteer for a simple task (handing out papers, tidying the library, cleanliness monitor); responsibility builds confidence and respect."}},
 {s:3,t:{ar:"أرحّب بالطلاب الجدد وأُشرك من يجلس وحده.",he:"אני מקבל/ת בברכה תלמידים חדשים ומשתף/ת את מי שיושב לבד.",en:"I welcome new students and include those who sit alone."},
  g:{ar:"إشراك الآخرين",he:"שיתוף אחרים",en:"Including others"},
  a:{ar:"ابحث في الاستراحة عمّن يجلس وحده وادعُه للانضمام إليكم؛ تصرّف بسيط قد يغيّر يومه كله.",he:"חפשו בהפסקה מי שיושב לבד והזמינו אותו להצטרף; מעשה פשוט שיכול לשנות לו את כל היום.",en:"At break, look for someone sitting alone and invite them to join you; a small gesture can change their whole day."}},
 {s:3,t:{ar:"أعترف بخطئي وأعتذر عندما أخطئ.",he:"אני מודה בטעות ומתנצל/ת כשאני טועה.",en:"I admit my mistakes and apologize when I'm wrong."},
  g:{ar:"الاعتراف بالخطأ والاعتذار",he:"הודאה בטעות והתנצלות",en:"Owning mistakes & apologizing"},
  a:{ar:"الاعتذار قوة وليس ضعفًا. قل بوضوح: «أنا آسف لأنني…» واقترح كيف تصلح ما حدث.",he:"התנצלות היא כוח ולא חולשה. אמרו בבירור: «אני מצטער/ת ש…» והציעו איך לתקן.",en:"Apologizing is strength, not weakness. Say clearly, “I'm sorry that I…” and suggest how you'll make it right."}}
];

return {UI,SECTIONS,ITEMS};
})()},

const TIPS = {

  });
  $("f1").addEventListener("input",()=>$("f1").closest(".card").classList.remove("missing"));
  form.addEventListener("submit",onSubmit);
  const rs=$("reset");if(rs)rs.addEventListener("click",()=>{keep=blank();shown=false;sendState=null;renderForm();window.scrollTo({top:0,behavior:"smooth"});});
  if(shown)renderResult(false);
}
function progress(){
  const s=snap();if(!s)return;const D=F.data;let n=s.lik.filter(v=>v!==null).length,t=D.ITEMS.length;
  for(const k in (D.MC||{})){t++;if(s.mc[k].length)n++;}
  if(D.RATING){t++;if(s.rating)n++;}
  $("bar").style.width=(n/t*100)+"%";$("ptext").textContent=L().progress(n,t);
}
function onSubmit(e){
  e.preventDefault();const s=snap(),D=F.data,miss=[];
  if(F.kind==="event"&&!s.f1.trim())miss.push($("f1").closest(".card"));
  for(const k in (D.MC||{}))if(D.MC[k].s===0&&!D.MC[k].end&&!s.mc[k].length)miss.push($("mcc_"+k));
  D.ITEMS.forEach((_,i)=>{if(s.lik[i]===null)miss.push($("q"+i));});
  if(D.RATING&&!s.rating)miss.push($("ratingc"));
  for(const k in (D.MC||{}))if(!(D.MC[k].s===0&&!D.MC[k].end)&&!s.mc[k].length)miss.push($("mcc_"+k));
  if(miss.length){miss.forEach(x=>x.classList.add("missing"));
    $("msg").textContent=(F.kind==="event"&&!s.f1.trim()&&miss.length===1)?L().evMissing:L().missing(miss.length);
    miss[0].scrollIntoView({behavior:"smooth",block:"center"});return;}
  $("msg").textContent="";keep=s;shown=true;
  if(F.mode==="event"&&sendState!=="ok"){sendState=null;}
  renderResult(true);$("result").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- results ---------- */
const effOf=s=>s.lik.map((v,i)=>F.data.ITEMS[i].nos?null:(F.data.ITEMS[i].r?6-v:v));
const pct=(arr)=>arr.length?(arr.reduce((a,b)=>a+b,0)-arr.length)/(arr.length*4)*100:0;
function secPcts(eff,sections){return sections.map(si=>pct(F.data.ITEMS.map((it,i)=>it.s===si&&eff[i]!=null?eff[i]:null).filter(v=>v!=null)));}
function barsHTML(sections,vals,showNum){
  return `<div class="bars">${sections.map((si,j)=>{const s=F.data.SECTIONS[si];const w=Math.max(3,Math.round(vals[j]));
   return `<div class="bar-row ${showNum?"":"nop"}"><span>${s.icon} ${s.t[lang]}</span><div class="bar-track"><div class="bar-fill" style="background:${s.color}" data-w="${w}"></div></div>${showNum?`<span class="pct" style="color:${s.color}">${Math.round(vals[j])}%</span>`:""}</div>`;}).join("")}</div>`;
}
function siList(eff){
  const l=L(),D=F.data;
  const strengths=D.ITEMS.filter((it,i)=>!it.nos&&eff[i]>=4);
  const improve=D.ITEMS.map((it,i)=>({it,v:eff[i]})).filter(x=>!x.it.nos&&x.v<=3).sort((a,b)=>a.v-b.v);
  return {strengths,improve,html:
   (strengths.length?`<h3>${l.strengthsH}</h3><ul>${strengths.map(it=>`<li>${it.g[lang]}</li>`).join("")}</ul>`:"")+
   `<h3>${l.improveH}</h3><ul>${improve.length?improve.map(x=>`<li><b>${x.it.g[lang]}</b><span class="tag ${x.v<=2?"low":""}">${x.v<=2?l.priority:l.improveTag}</span><br>${x.it.a[lang]}</li>`).join(""):`<li>${l.none}</li>`}</ul>`};
}
function mcList(s,k){const m=F.data.MC[k];return s.mc[k].map(v=>v==="o"?(s.other[k].trim()||L().other.replace("…","")):m.opts[+v][lang]);}
function mcListAr(s,k){const m=F.data.MC[k];return s.mc[k].map(v=>v==="o"?(s.other[k].trim()||"أخرى"):m.opts[+v].ar);}
function afterRender(){
  requestAnimationFrame(()=>qa(".bar-fill").forEach(b=>b.style.width=b.dataset.w+"%"));
  const cp=$("copy");if(cp)cp.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(copyText);$("copyMsg").textContent=C().copied;}catch(e){$("copyMsg").textContent=C().copyFail;}});
  const ag=$("again");if(ag)ag.addEventListener("click",()=>$("questions").scrollIntoView({behavior:"smooth"}));
}
function who(s){return [s.f1,s.f2].map(x=>(x||"").trim()).filter(Boolean).join(" · ");}

function renderResult(animate){
  const r=$("result");r.style.display="block";
  if(F.mode==="score")return resScore(animate);
  if(F.mode==="stage")return resStage();
  return resEvent();
}
function resScore(animate){
  const l=L(),c=C(),s=keep,eff=effOf(s),D=F.data;
  const score=Math.round(pct(eff.filter(v=>v!=null)));
  const li=score>=85?0:score>=70?1:score>=50?2:3,color=["#1e90ff","#20bf6b","#e0a800","#ff4757"][li];
  const secIdx=D.SECTIONS.map((_,i)=>i),secs=secPcts(eff,secIdx),sl=siList(eff);
  const care=l.care&&D.ITEMS.some((it,i)=>it.care&&eff[i]<=2);
  $("result").innerHTML=`
   <div class="score"><div class="ring" id="ring" style="--rc:${color}"><div><strong id="scoreNum">${animate?0:score}</strong><span>/ 100</span></div></div>
     <div style="flex:1;min-width:200px"><div class="who">${esc(who(s))}</div><p class="level" style="color:${color}">${l.levels[li][0]}</p><p>${l.levels[li][1]}</p></div></div>
   ${barsHTML(secIdx,secs,true)}${sl.html}
   <h3>${l.generalH}</h3><p class="general">${l.levels[li][2]}</p>
   ${care?`<h3>${l.careH}</h3><p class="general" style="background:rgba(156,39,176,.07)">${l.care}</p>`:""}
   <div class="btns"><button type="button" class="main" id="copy">${c.copy}</button><button type="button" class="ghost" id="again">${c.edit}</button></div>
   <div class="msg" id="copyMsg" style="color:#20bf6b"></div>`;
  const ring=$("ring");
  if(animate){let cur=0;const step=()=>{const el=$("scoreNum");if(!el||!ring.isConnected)return;cur=Math.min(score,cur+2);el.textContent=cur;ring.style.setProperty("--p",cur);if(cur<score)requestAnimationFrame(step);};step();}else ring.style.setProperty("--p",score);
  copyText=`${F.title[lang]}${who(s)?" – "+who(s):""}\n${l.scoreW}: ${score}/100 – ${l.levels[li][0]}\n`+secIdx.map((si,j)=>`${D.SECTIONS[si].t[lang]}: ${Math.round(secs[j])}%`).join("\n")+
    `\n${l.strW}: ${sl.strengths.map(x=>x.g[lang]).join(sep())||"-"}\n${l.impW}: ${sl.improve.map(x=>x.it.g[lang]).join(sep())||"-"}`;
  afterRender();
}
function resStage(){
  const l=L(),c=C(),s=keep,eff=effOf(s),D=F.data;
  const p=pct(eff.filter(v=>v!=null)),stage=p>=80?2:p>=50?1:0,colors=["#ffa502","#1e90ff","#20bf6b"];
  const scored=[...new Set(D.ITEMS.filter(it=>!it.nos).map(it=>it.s))],secs=secPcts(eff,scored),sl=siList(eff);
  const helpI=D.ITEMS.findIndex(it=>it.nos),needHelp=helpI>=0&&s.lik[helpI]>=4;
  const feel=(s.mc.feel||[]).filter(v=>v!=="o").map(v=>D.MC.feel.opts[+v]);
  const care=needHelp||feel.some(o=>o.care)||(s.mc.what||[]).includes("2");
  const rows=[[l.pStage,l.stages[stage][0]+" "+l.stages[stage][1]],[l.pWhat,mcList(s,"what").join(sep())],[l.pFeel,mcList(s,"feel").join(sep())],[l.pSteps,mcList(s,"repair").join(sep())]];
  if(s.open.trim())rows.push([l.pMsg,s.open.trim()]);
  $("result").innerHTML=`
   <div class="who">${esc(who(s))}</div>
   <h3 style="margin-top:6px">${l.indicatorH}</h3>
   <div class="stages">${l.stages.map((x,i)=>`<div class="stage ${i===stage?"on":""}" style="${i===stage?"background:"+colors[i]:""}"><span class="ic">${x[0]}</span>${x[1]}</div>`).join("")}</div>
   <p class="level" style="color:${colors[stage]}">${l.stages[stage][0]} ${l.stages[stage][1]}</p><p>${l.levelText[stage]}</p>
   ${barsHTML(scored,secs,false)}${sl.html}
   ${feel.length?`<h3>${l.tipsH}</h3>${feel.map(o=>`<div class="tip-row"><b>${o[lang]}</b><br>${D.TIPS[o.k][lang]}</div>`).join("")}`:""}
   ${care?`<h3>${l.careH}</h3><p class="general" style="background:rgba(156,39,176,.07)">${l.care}</p>`:""}
   <h3>${l.planH}</h3><dl class="plan">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}${needHelp?`<dt>🤝</dt><dd>${l.pHelp}</dd>`:""}</dl>
   <h3>${l.generalH}</h3><p class="general">${l.general}</p>
   <div class="btns"><button type="button" class="main" id="copy">${l.copy}</button><button type="button" class="ghost" id="again">${c.edit}</button></div>
   <div class="msg" id="copyMsg" style="color:#20bf6b"></div>`;
  copyText=`${l.resultFor}${who(s)?" – "+who(s):""}\n`+rows.map(r=>`${r[0]}: ${r[1]}`).join("\n")+(needHelp?`\n${l.pHelp}`:"");
  afterRender();
}
function buildPayload(s){
  const D=F.data,a={"الاستمارة":F.id,"اسم الفعالية":s.f1.trim(),"الصف":s.f2.trim(),"اللغة":lang};
  D.ITEMS.forEach((it,i)=>a[it.h]=s.lik[i]);
  if(D.RATING)a[D.RATING.h]=s.rating;
  for(const k in (D.MC||{}))a[D.MC[k].h]=mcListAr(s,k).join("، ");
  if(D.OPEN)a[D.OPEN.h]=s.open.trim();
  return {form:F.id,answers:a};
}
async function doSend(){
  const st=$("sendStatus"),c=C(),mine=F,body=JSON.stringify(lastPayload);sendState="sending";if(st){st.textContent=c.sending;st.style.color="var(--muted)";}
  let ok=false;
  try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),15000);
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body,signal:ctrl.signal});
    clearTimeout(t);ok=true;
  }catch(e){ok=false;}
  if(F!==mine)return;
  sendState=ok?"ok":"fail";
  paintSend();
}
function paintSend(){
  const st=$("sendStatus"),c=C(),rb=$("retry");if(!st)return;
  if(sendState==="ok"){st.textContent=c.sent;st.style.color="#20bf6b";if(rb)rb.style.display="none";const r=$("reset");if(r)r.remove();}
  else if(sendState==="fail"){st.textContent=c.sendFail;st.style.color="var(--red)";if(rb)rb.style.display="inline-block";}
  else{st.textContent=c.sending;st.style.color="var(--muted)";}
}
function resEvent(){
  const l=L(),c=C(),s=keep,D=F.data,eff=effOf(s);
  const secIdx=D.SECTIONS.map((_,i)=>i),secs=secPcts(eff,secIdx);
  const rows=[[l.pEvent,s.f1.trim()],[l.pOverall,`${s.rating} / 10`],[l.pLiked,mcList(s,"liked").join(sep())]];
  if(s.open.trim())rows.push([l.pSugg,s.open.trim()]);
  $("result").innerHTML=`
   <div style="text-align:center"><div style="font-size:3rem;line-height:1.2">💌</div><p class="level" style="color:#20bf6b">${c.thanks}</p><p>${l.thanksText}</p>
   <div class="send-status" id="sendStatus"></div>
   <div class="btns"><button type="button" class="main" id="retry" style="display:none">${c.retry}</button></div></div>
   <h3>${l.barsH}</h3>${barsHTML(secIdx,secs,true)}
   <h3>${l.sumH}</h3><dl class="plan">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
   <div class="btns"><a class="backlink" href="#">${c.back}</a></div>`;
  $("retry").addEventListener("click",doSend);
  afterRender();
  if(sendState===null){lastPayload=buildPayload(s);doSend();}else paintSend();
}

/* ---------- routing & language ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const f=FORMS.find(x=>x.id===h);
  if(f){ if(F!==f){F=f;keep=null;started=false;shown=false;sendState=null;} renderForm(); }
  else { F=null; renderHome(); }
  window.scrollTo(0,0);
}
function setLang(l){
  if(F)keep=snap()||keep;
  lang=l;document.documentElement.lang=l;document.documentElement.dir=C().dir;
  try{localStorage.setItem("me-lang",l);}catch(e){}
  if(F)renderForm();else renderHome();
}
document.addEventListener("click",e=>{const b=e.target.closest(".lang-btn");if(b)setLang(b.dataset.lang);});
window.addEventListener("hashchange",route);
try{const s=localStorage.getItem("me-lang");if(COMMON[s])lang=s;}catch(e){}
document.documentElement.lang=lang;document.documentElement.dir=C().dir;
route();
</script>
</body>
</html>
